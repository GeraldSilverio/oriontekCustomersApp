spring.application.name=oriontek.customers.app
spring.datasource.url=jdbc:postgresql://localhost:5432/oriontek_customers
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=8080
spring.threads.virtual.enabled=true
springdoc.swagger-ui.path=/swagger
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/master
